services:
  postgres:
    image: postgres:16-alpine
    container_name: inovaskill-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inovaskill_importer}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-inovaskill_importer}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  osrm:
    image: osrm/osrm-backend:latest
    container_name: inovaskill-osrm
    profiles:
      - osrm
    command: osrm-routed --algorithm mld /data/sudeste-latest.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./infra/osrm:/data
    restart: unless-stopped

  api:
    container_name: inovaskill-api
    build:
      context: ./backend
      dockerfile: InovaSkill.Importer.Api/Dockerfile
    ports:
      - "${API_PORT:-5279}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      DisableHttpsRedirection: "true"
      ConnectionStrings__ImportDb: Host=postgres;Port=5432;Database=${POSTGRES_DB:-inovaskill_importer};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Secret: ${JWT_SECRET:-local-mvp-secret-change-before-production-2026}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      Storage__ImportsPath: /data/route-imports
      RouteOptimization__DistanceProvider: ${ROUTE_DISTANCE_PROVIDER:-Geographic}
      RouteOptimization__OsrmBaseUrl: ${OSRM_BASE_URL:-http://osrm:5000}
    volumes:
      - route_imports_data:/data/route-imports
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

  worker:
    container_name: inovaskill-worker
    build:
      context: ./backend
      dockerfile: InovaSkill.Importer.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__ImportDb: Host=postgres;Port=5432;Database=${POSTGRES_DB:-inovaskill_importer};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Storage__ImportsPath: /data/route-imports
      RouteOptimization__DistanceProvider: ${ROUTE_DISTANCE_PROVIDER:-Geographic}
      RouteOptimization__OsrmBaseUrl: ${OSRM_BASE_URL:-http://osrm:5000}
    volumes:
      - route_imports_data:/data/route-imports
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50

  frontend:
    container_name: inovaskill-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50

volumes:
  postgres_data:
  route_imports_data:
