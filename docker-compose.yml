services:
  postgres:
    image: postgres:16-alpine
    container_name: inovaskill-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inovaskill_importer}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-inovaskill_importer}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    container_name: inovaskill-api
    build:
      context: ./backend
      dockerfile: InovaSkill.Importer.Api/Dockerfile
    ports:
      - "${API_PORT:-5279}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      DisableHttpsRedirection: "true"
      ConnectionStrings__ImportDb: Host=postgres;Port=5432;Database=${POSTGRES_DB:-inovaskill_importer};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Secret: ${JWT_SECRET:-local-mvp-secret-change-before-production-2026}
      WhatsApp__WebhookSecret: ${WHATSAPP_WEBHOOK_SECRET:-local-whatsapp-bridge-secret}
      Storage__ImportsPath: /data/route-imports
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WhatsApp__BaseUrl: http://whatsapp-bridge:8081
      WhatsApp__InstanceName: ${WHATSAPP_INSTANCE_NAME:-grespan}
    volumes:
      - route_imports_data:/data/route-imports
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

  whatsapp-bridge:
    container_name: inovaskill-whatsapp-bridge
    build:
      context: ./whatsapp-bridge
      dockerfile: Dockerfile
    ports:
      - "${WHATSAPP_BRIDGE_PORT:-8081}:8081"
    environment:
      WHATSAPP_BRIDGE_HOST: 0.0.0.0
      WHATSAPP_BRIDGE_PORT: 8081
      WHATSAPP_AUTH_PATH: /app/.data/auth
      WHATSAPP_WEBHOOK_URL: http://api:8080/api/integrations/whatsapp/webhook
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-local-whatsapp-bridge-secret}
    volumes:
      - whatsapp_auth_data:/app/.data/auth
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50

  worker:
    container_name: inovaskill-worker
    build:
      context: ./backend
      dockerfile: InovaSkill.Importer.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__ImportDb: Host=postgres;Port=5432;Database=${POSTGRES_DB:-inovaskill_importer};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Storage__ImportsPath: /data/route-imports
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WhatsApp__BaseUrl: http://whatsapp-bridge:8081
      WhatsApp__InstanceName: ${WHATSAPP_INSTANCE_NAME:-grespan}
    volumes:
      - route_imports_data:/data/route-imports
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50

  frontend:
    container_name: inovaskill-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50

volumes:
  postgres_data:
  route_imports_data:
  whatsapp_auth_data:
