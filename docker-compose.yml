services:
  postgres:
    image: postgres:16-alpine
    container_name: inovaskill-postgres
    environment:
      POSTGRES_DB: inovaskill_importer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inovaskill_importer"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    container_name: inovaskill-api
    build:
      context: ./backend
      dockerfile: InovaSkill.Importer.Api/Dockerfile
    ports:
      - "5279:8080"
    environment:
      ConnectionStrings__ImportDb: Host=postgres;Port=5432;Database=inovaskill_importer;Username=postgres;Password=postgres
      Storage__ImportsPath: /data/route-imports
    volumes:
      - route_imports_data:/data/route-imports
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0

  worker:
    container_name: inovaskill-worker
    build:
      context: ./backend
      dockerfile: InovaSkill.Importer.Worker/Dockerfile
    environment:
      ConnectionStrings__ImportDb: Host=postgres;Port=5432;Database=inovaskill_importer;Username=postgres;Password=postgres
      Storage__ImportsPath: /data/route-imports
    volumes:
      - route_imports_data:/data/route-imports
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50

  frontend:
    container_name: inovaskill-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50

volumes:
  postgres_data:
  route_imports_data:
